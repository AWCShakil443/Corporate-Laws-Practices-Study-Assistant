name: Monitor legal and syllabus sources
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check official source pages
        env:
          COMPANIES_ACT: https://bdlaws.minlaw.gov.bd/act-788.html
          ICAB_SYLLABUS: https://www.icab.org.bd/page/icab-latest-syllabus
        run: |
          set -e
          mkdir -p .source-cache
          curl -L --fail --silent --show-error "$COMPANIES_ACT" -o companies-act.html
          curl -L --fail --silent --show-error "$ICAB_SYLLABUS" -o icab-syllabus.html
          sha256sum companies-act.html icab-syllabus.html > current.sha256
          if [ -f .source-cache/previous.sha256 ] && ! cmp -s current.sha256 .source-cache/previous.sha256; then echo "SOURCE_CHANGED=true" >> "$GITHUB_ENV"; fi
      - name: Open review issue when sources change
        if: env.SOURCE_CHANGED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:'Legal or syllabus source changed: review required',body:'An official source changed. Review the Companies Act and/or ICAB syllabus before changing study content. No study content is automatically overwritten.',labels:['source-review']});
