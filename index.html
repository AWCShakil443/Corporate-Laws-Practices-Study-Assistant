<!doctype html>
<html lang="en">
<head>

<title>Corporate Laws & Practices | Study Assistant</title>
<style>
:root{--bg:#edf1ec;--paper:#fbfcf8;--paper2:#f4f7f1;--ink:#24332d;--muted:#68766e;--line:#d6dfd6;--green:#4e705d;--green2:#dfece2;--cream:#f7f0df;--blue:#e8f0f2;--shadow:0 10px 30px rgba(42,61,50,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,Segoe UI,Arial,sans-serif}
.header{height:70px;position:sticky;top:0;z-index:50;background:rgba(251,252,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:10px 20px;gap:18px}.brand{min-width:265px;font-weight:800;font-size:17px}.brand span{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em;font-weight:700}.search{flex:1;max-width:650px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;outline:none}.controls{margin-left:auto;display:flex;gap:7px}.controls button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;color:var(--ink);cursor:pointer}.shell{display:grid;grid-template-columns:260px 330px minmax(500px,1fr);min-height:calc(100vh - 70px)}
.sidebar,.topics{position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto;background:var(--paper);border-right:1px solid var(--line)}.sidebar{padding:18px 12px}.section-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:4px 9px 12px}.act{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:13px;padding:13px 12px;margin:4px 0;cursor:pointer;color:var(--ink)}.act:hover{background:var(--paper2)}.act.active{background:var(--green2);border-color:#c9dccd}.act strong{font-size:12px}.act small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.weight{float:right;color:var(--green);background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 6px;font-size:9px;font-weight:800}.locked{opacity:.48}.locked:after{content:'  • coming next';font-size:9px;color:var(--muted)}
.topics{padding:18px 14px}.topics h2{font-size:16px;margin:2px 8px 2px}.topics .subtitle{font-size:10px;color:var(--muted);margin:0 8px 13px}.objective{background:var(--cream);border:1px solid #e8dcc2;border-radius:13px;padding:12px;margin:0 0 14px}.objective b{font-size:10px;text-transform:uppercase;letter-spacing:.08em}.objective ul{margin:7px 0 0;padding-left:18px;font-size:10px}.topic{width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;border-radius:7px;padding:8px 9px;margin:2px 0;cursor:pointer;color:var(--ink);font-size:11px}.topic:hover{background:var(--paper2)}.topic.active{background:var(--green2);border-left-color:var(--green);font-weight:700}
main{padding:30px 38px 70px;min-width:0}.crumb{font-size:10px;color:var(--muted);margin-bottom:7px}.hero{margin-bottom:22px}.hero h1{font-size:30px;line-height:1.2;margin:0 0 7px}.hero p{color:var(--muted);margin:0;max-width:900px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{font-size:9px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 9px}.study-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.full{grid-column:1/-1}.eyebrow{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.card h3{font-size:16px;margin:5px 0 11px}.section-ref{display:inline-block;background:var(--green2);border:1px solid #c9dccd;color:#355a43;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:800;margin-bottom:10px}.lawbox{background:#f7f7f1;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:Georgia,serif;line-height:1.7;white-space:pre-wrap}.bn{font-family:"Noto Serif Bengali","Nirmala UI",sans-serif;margin-top:10px}.divider{height:1px;background:var(--line);margin:13px 0}.source{font-size:10px;color:var(--muted)}.source a{color:var(--green);font-weight:700;text-decoration:none}.note{background:var(--cream);border:1px solid #e8dcc2;border-radius:11px;padding:11px;font-size:11px}.example{background:#edf4ee}.example .scenario{font-weight:700;margin-bottom:5px}.exam{background:var(--blue)}.flash{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.flash div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px}.flash b{display:block;font-size:10px}.flash span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.footer{margin-top:22px;color:var(--muted);font-size:10px;text-align:center}.progress{height:5px;background:#dfe6df;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress span{display:block;height:100%;width:4%;background:var(--green)}
@media(max-width:1050px){.shell{grid-template-columns:220px 280px 1fr}main{padding:25px}.study-grid{grid-template-columns:1fr}}@media(max-width:760px){.header{height:auto;flex-wrap:wrap}.brand{min-width:0}.search{order:3;flex-basis:100%}.shell{display:block}.sidebar,.topics{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.sidebar{display:flex;overflow:auto;padding:10px}.sidebar .section-label{display:none}.act{min-width:210px}.topics{max-height:360px}.study-grid{grid-template-columns:1fr}main{padding:20px 14px}.hero h1{font-size:24px}.flash{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">Corporate Laws & Practices<span>ICAB PROFESSIONAL LEVEL • CUSTOM STUDY ASSISTANT</span></div>
  <div class="search"><input id="search" placeholder="Search topic, section or keyword…"></div>
  <div class="controls"><button onclick="changeFont(-1)">A−</button><button onclick="changeFont(1)">A+</button><button onclick="resetView()">Reset</button></div>
</header>
<div class="shell">
  <aside class="sidebar"><div class="section-label">Acts & syllabus weighting</div><div id="acts"></div></aside>
  <aside class="topics" id="topics"></aside>
  <main id="main"></main>
</div>
<script>
const acts=[
 {id:1,name:'Companies Act, 1994',full:'The Companies Act, 1994 and Secretarial Practices',weight:'30%',status:'active'},
 {id:2,name:'Securities & Exchange',full:'Laws Relating to the Securities and Exchange',weight:'20%',status:'next'},
 {id:3,name:'Bank Company Act, 1991',full:'The Bank Company Act, 1991',weight:'15%',status:'next'},
 {id:4,name:'Finance Company Act, 2023',full:'Finance Company Act, 2023',weight:'5%',status:'next'},
 {id:5,name:'Bangladesh Labour Act, 2006',full:'Bangladesh Labour Act, 2006 and Rules, 2015',weight:'10%',status:'next'},
 {id:6,name:'Insurance Act, 2010',full:'Insurance Act, 2010',weight:'10%',status:'next'},
 {id:7,name:'Financial Reporting Act, 2015',full:'Financial Reporting Act, 2015',weight:'10%',status:'next'},
 {id:8,name:'FRC Enlistment Rules, 2022',full:'FRC (Audit & Audit Firm Enlistment) Rules, 2022',weight:'Within FRA',status:'next'}
];
const topics=[
'Introduction','Constitution and incorporation','Shares and capital','Regulations for management of a company limited by shares','Board of directors','Members’ meetings or meetings of the shareholders','Maintenance of books of account and audit','Directors','Liquidation','Individual voluntary arrangements','Bankruptcy','Procedure for formation and registration of a company','Amendments','Returns to be filed and the time frame','Statutory books and registers','Board meeting and minute','Underwriting','Corporate disclosure policy','Thorough public dissemination','Clarification or confirmation of rumours and reports','Response to unusual market action','Unwarranted promotional disclosure','Insider trading','Formation, registration, management, etc. of a One Person Company (OPC)'
];
const lessons={
'Introduction':{
ref:'Sections 4, 5 and related provisions',en:'The Companies Act, 1994 is the principal statute governing incorporated companies in Bangladesh. It provides the legal framework for formation, registration, management, capital, meetings, accounts, audit and winding up.',bn:'কোম্পানী আইন, ১৯৯৪ বাংলাদেশে নিবন্ধিত কোম্পানীর গঠন, নিবন্ধন, ব্যবস্থাপনা, মূলধন, সভা, হিসাব, নিরীক্ষা ও অবসায়নের প্রধান আইনগত কাঠামো নির্ধারণ করে।',easy:'Think of the Act as the operating rulebook of a company. In an exam, identify the company event first, then identify the relevant statutory provision.',example:'A private manufacturing company wants to appoint directors, issue shares and hold its annual general meeting. Each of these actions is governed by different provisions of the Act.',exam:'Start answers with the legal provision, then explain the rule and finally apply it to the facts.'},
'Constitution and incorporation':{
ref:'Section 5 • Mode of forming incorporated company',en:'Any seven or more persons or, where the company to be formed will be a private company, any two or more persons associated for any lawful purpose may, by subscribing their names to a memorandum of association and otherwise complying with the requirements of this Act in respect of registration, form an incorporated company.',bn:'পাবলিক কোম্পানী গঠনের ক্ষেত্রে সাত বা ততোধিক ব্যক্তি এবং প্রাইভেট কোম্পানী গঠনের ক্ষেত্রে দুই বা ততোধিক ব্যক্তি, আইনানুগ যে কোন উদ্দেশ্যে, সংঘস্মারকে স্বাক্ষর করিয়া এবং নিবন্ধন সংক্রান্ত এই আইনের বিধান পালন করিয়া নিগমিত কোম্পানী গঠন করিতে পারিবে।',easy:'The basic threshold is 7 persons for a public company and 2 persons for a private company. But meeting the number alone does not create the company. The memorandum and statutory registration requirements must also be completed.',example:'Two founders want to establish a private garment company. They satisfy the member threshold, but the company becomes incorporated only after the required constitutional documents and registration process are completed.',exam:'Memorise the 7 versus 2 threshold. In scenario questions, do not confuse the minimum number of subscribers with completion of incorporation.'},
'Shares and capital':{
ref:'Sections 30, 53, 58, 59, 74, 154 and 155',en:'The Act contains provisions dealing with share certificates, transfer and transmission of shares, alteration of share capital, reduction of share capital, reserve share capital and further issue of capital.',bn:'আইনে শেয়ার সার্টিফিকেট, শেয়ার হস্তান্তর ও উত্তরাধিকারসূত্রে স্থানান্তর, শেয়ার মূলধনের পরিবর্তন, মূলধন হ্রাস, রিজার্ভ শেয়ার মূলধন এবং অতিরিক্ত মূলধন ইস্যু সংক্রান্ত বিধান রয়েছে।',easy:'Treat share capital as a controlled legal structure. A company cannot simply change its capital whenever management wants. The Act specifies the permitted mechanism and, in relevant cases, shareholder or regulatory involvement.',example:'A company wants to increase its authorised capital before issuing additional shares. Management must follow the applicable statutory procedure instead of treating the accounting entry as sufficient.',exam:'When answering, distinguish authorised, issued, subscribed and paid-up capital where the facts require it.'},
'Board of directors':{
ref:'Relevant provisions on directors and board management',en:'The Act regulates the constitution, appointment, retirement, powers and responsibilities of directors and the conduct of board affairs.',bn:'আইনে পরিচালনা পর্ষদের গঠন, পরিচালক নিয়োগ, অবসর, ক্ষমতা ও দায়িত্ব এবং বোর্ডের কার্যক্রম পরিচালনার বিধান নির্ধারিত হয়েছে।',easy:'The board is the company’s principal decision-making organ. For an exam scenario, identify whether the issue concerns appointment, qualification, power, conflict, meeting or liability.',example:'The board approves a major transaction with an entity connected to one of the directors. The answer should consider the statutory rules on directors and disclosure or conflict, rather than only the commercial rationale.',exam:'Separate the company’s power from the director’s personal interest. They are not automatically the same.'},
'Members’ meetings or meetings of the shareholders':{
ref:'Relevant provisions on general meetings and resolutions',en:'The Act provides the framework for meetings of members, notice, quorum, ordinary and special resolutions and related procedural requirements.',bn:'আইনে সদস্যদের সভা, নোটিশ, কোরাম, সাধারণ ও বিশেষ প্রস্তাব এবং সংশ্লিষ্ট সভা-সংক্রান্ত পদ্ধতির কাঠামো নির্ধারিত হয়েছে।',easy:'A valid shareholder decision is not only about what was decided. The statutory process for calling and conducting the meeting also matters.',example:'Shareholders approve a significant constitutional change without following the required notice and resolution procedure. The validity of the decision may therefore become an issue.',exam:'For meeting questions, use the sequence: notice → quorum → chair → agenda → resolution → voting → minutes.'},
'Maintenance of books of account and audit':{
ref:'Accounts and audit provisions',en:'The Act imposes requirements concerning books of account, financial statements, appointment and duties of auditors and audit reporting.',bn:'আইনে হিসাবের বই সংরক্ষণ, আর্থিক বিবরণী, নিরীক্ষক নিয়োগ, নিরীক্ষকের দায়িত্ব এবং নিরীক্ষা প্রতিবেদনের বিষয়ে বিধান রয়েছে।',easy:'For audit questions, connect the legal requirement with the company’s accounting records and statutory reporting responsibilities.',example:'An auditor discovers that the company has not maintained adequate supporting records for material transactions. The issue should be assessed against the statutory requirements for books and audit.',exam:'Do not answer an audit-law question only with auditing standards. Start from the Companies Act requirement and then connect the audit consequence.'},
'Liquidation':{
ref:'Winding up provisions',en:'The Act provides mechanisms and procedures for winding up a company and dealing with its affairs after the decision to wind up.',bn:'আইনে কোম্পানীর অবসায়ন এবং অবসায়নের পর কোম্পানীর সম্পদ ও দায়-দায়িত্ব নিষ্পত্তির পদ্ধতি নির্ধারিত হয়েছে।',easy:'Liquidation means bringing the company’s affairs to an end through a legal process. Assets and liabilities are dealt with according to the applicable winding-up procedure.',example:'A company can no longer continue its business and the members decide to close it. The company cannot simply stop operating; the applicable winding-up process must be followed.',exam:'Distinguish voluntary and court-related winding-up concepts when the question asks for procedure.'},
'Formation, registration, management, etc. of a One Person Company (OPC)':{
ref:'OPC provisions introduced through amendment framework',en:'The Act, as amended, provides a framework for the formation, registration and management of a One Person Company, subject to the statutory conditions applicable to an OPC.',bn:'সংশোধিত আইনে ওয়ান পার্সন কোম্পানী (OPC) গঠন, নিবন্ধন ও ব্যবস্থাপনার জন্য প্রযোজ্য আইনগত কাঠামো নির্ধারিত হয়েছে।',easy:'An OPC is designed for a single-member corporate structure while retaining the separate corporate framework. Always apply the specific OPC provisions rather than assuming the ordinary private-company rules answer every issue.',example:'A sole entrepreneur wants a corporate vehicle without bringing in another shareholder. The OPC framework may provide the appropriate route, subject to statutory requirements.',exam:'Treat OPC as a separate syllabus topic and check its specific statutory conditions before applying general company rules.'}
};
const source='https://bdlaws.minlaw.gov.bd/act-print-788.html';
let state={topic:'Introduction',font:14};
function renderActs(){document.getElementById('acts').innerHTML=acts.map(a=>`<button class="act ${a.id===1?'active':'locked'}" onclick="selectAct(${a.id})"><span class="weight">${a.weight}</span><strong>${a.name}</strong><small>${a.full}</small></button>`).join('')}
function renderTopics(){document.getElementById('topics').innerHTML=`<h2>Companies Act, 1994</h2><p class="subtitle">Chapter 1 • Secretarial Practices • 30% indicative weighting</p><div class="objective"><b>Learning objectives</b><ul><li>Explain the legal nature and characteristics of companies.</li><li>Apply incorporation and constitutional requirements.</li><li>Advise on shares, capital, meetings, directors, accounts and audit.</li><li>Apply winding-up and secretarial compliance principles.</li></ul></div>${topics.map((t,i)=>`<button class="topic ${t===state.topic?'active':''}" onclick="selectTopic(${i})">${i+1}. ${t}</button>`).join('')}`}
function selectAct(id){if(id!==1){alert('Sequential build: Companies Act is Module 1. The next Act will be unlocked after this module is completed.');return}state.topic='Introduction';renderTopics();renderMain()}
function selectTopic(i){state.topic=topics[i];renderTopics();renderMain();document.getElementById('main').scrollIntoView({behavior:'smooth',block:'start'})}
function renderMain(){let l=lessons[state.topic]||{ref:'Topic coverage',en:'This topic is included in the ICAB syllabus and will be populated section-by-section from the authentic Act in the next content pass.',bn:'এই বিষয়টি ICAB সিলেবাসের অন্তর্ভুক্ত। পরবর্তী কনটেন্ট পাসে প্রামাণিক আইনের ধারাভিত্তিক তথ্য যুক্ত করা হবে।',easy:'Use the topic navigation on the left to move through the syllabus. The site is intentionally kept on one page.',example:'The example will be linked directly to the relevant statutory provision.',exam:'Always quote the section or rule reference before applying the legal principle.'};let idx=topics.indexOf(state.topic)+1;document.getElementById('main').innerHTML=`<div class="crumb">Home / Companies Act, 1994 / ${idx}. ${state.topic}</div><section class="hero"><h1>${state.topic}</h1><p>Professional Level study view with the statutory provision, বাংলা meaning, plain-language explanation and Bangladesh-based application.</p><div class="chips"><span class="chip">Companies Act, 1994</span><span class="chip">ICAB Professional Level</span><span class="chip">Topic ${idx} of ${topics.length}</span></div><div class="progress"><span style="width:${Math.max(4,idx/topics.length*100)}%"></span></div></section><div class="study-grid"><section class="card"><div class="eyebrow">Box 1 • Actual law</div><h3>Statutory provision</h3><div class="section-ref">${l.ref}</div><div class="lawbox">${l.en}<div class="divider"></div><div class="bn">${l.bn}</div></div><div class="source">Authentic reference: <a href="${source}" target="_blank" rel="noopener">Bangladesh Laws • Companies Act, 1994 ↗</a></div></section><section class="card"><div class="eyebrow">Box 2 • Easy understanding</div><h3>What does it mean?</h3><p>${l.easy}</p><div class="note"><b>Study approach</b><br>Read the section first. Then identify the legal requirement, the person responsible and the consequence of non-compliance.</div></section><section class="card full example"><div class="eyebrow">Box 3 • Practical application</div><h3>Bangladesh example</h3><div class="scenario">Scenario</div><p>${l.example}</p><div class="note"><b>How to answer</b><br>State the relevant section → explain the legal rule → apply the facts → conclude clearly.</div></section><section class="card full exam"><div class="eyebrow">Professional Level exam focus</div><h3>Remember this</h3><p>${l.exam}</p><div class="flash"><div><b>Section first</b><span>Quote the provision before analysis.</span></div><div><b>Apply facts</b><span>Do not stop at a textbook definition.</span></div><div><b>Conclude</b><span>Give a clear legal conclusion.</span></div></div></section></div><div class="footer">Source basis: ICAB 2026 Corporate Laws & Practices syllabus and authentic Bangladesh legislation. Legal text is reproduced only for study/reference purposes.</div>`;document.body.style.fontSize=state.font+'px'}
function changeFont(n){state.font=Math.min(18,Math.max(12,state.font+n));renderMain()}function resetView(){state={topic:'Introduction',font:14};renderTopics();renderMain();document.getElementById('search').value=''}
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.topic').forEach((el,i)=>el.style.display=topics[i].toLowerCase().includes(q)?'block':'none')});renderActs();renderTopics();renderMain();
</script>
</body>
</html>
