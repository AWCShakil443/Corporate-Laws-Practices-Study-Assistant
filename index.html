<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corporate Laws & Practices | Study Assistant</title><style>:root{--bg:#eef2ed;--paper:#fbfcf8;--ink:#26352e;--muted:#68766e;--line:#d7dfd7;--act:#e7efe9;--topics:#edf0f7;--study:#fbf4e5;--example:#e8f1ec;--exam:#e9eff4;--green:#50725e;--navy:#596b82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Segoe UI,Arial,sans-serif}.top{height:70px;position:sticky;top:0;z-index:20;background:#fbfcf8ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 18px}.brand{font-weight:800;min-width:275px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.12em}.search{flex:1;max-width:680px}.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:white}.buttons{display:flex;gap:6px}.buttons button,.partbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--ink)}.shell{display:grid;grid-template-columns:255px 320px minmax(520px,1fr);min-height:calc(100vh - 70px)}.left,.middle{position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.left{padding:16px 11px;background:var(--act);border-right:1px solid #cbd8cf}.middle{padding:16px 13px;background:var(--topics);border-right:1px solid #d0d6e0}.label{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:5px 8px 12px}.act{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:12px;margin:3px 0;color:var(--ink);cursor:pointer}.act.active{background:#d7e6db;border-color:#b9cfbf}.act.locked{opacity:.48}.act b{font-size:12px}.act small{display:block;color:var(--muted);font-size:10px}.weight{float:right;border:1px solid var(--line);background:white;border-radius:7px;padding:1px 6px;color:var(--green);font-size:9px}.middle h2{font-size:16px;margin:4px 8px}.sub{font-size:10px;color:var(--muted);margin:0 8px 12px}.objective{background:#f5f1df;border:1px solid #e2d9bc;border-radius:12px;padding:11px;margin-bottom:13px;font-size:10px}.parts{display:flex;gap:5px;margin:8px 0 12px}.partbtn.active{background:var(--navy);color:white}.topic{width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;border-radius:7px;padding:8px 9px;margin:2px 0;color:var(--ink);cursor:pointer;font-size:11px}.topic:hover{background:#e2e6f0}.topic.active{background:#dfe5ef;border-left-color:var(--navy);font-weight:700}.topic.locked{opacity:.52}main{padding:30px 38px 70px;background:#f7f7f3}.hero h1{font-size:30px;line-height:1.2;margin:0 0 7px}.hero p{color:var(--muted);max-width:900px;margin:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 20px}.chip{font-size:9px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid var(--line);border-radius:16px;padding:18px}.lawcard{background:var(--study)}.easycard{background:#eef2f7}.full{grid-column:1/-1}.eyebrow{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.card h3{font-size:16px;margin:5px 0 10px}.law{background:#fffdf7;border:1px solid #e5ddc9;border-radius:11px;padding:13px;font-family:Georgia,serif;line-height:1.7}.bn{font-family:"Noto Serif Bengali","Nirmala UI",sans-serif;margin-top:10px}.source{font-size:10px;color:var(--muted);margin-top:9px}.source a{color:var(--green);font-weight:700}.example{background:var(--example)}.exam{background:var(--exam)}.warning{background:#f5eadb}.status{font-size:10px;color:var(--muted)}.update{border-left:4px solid var(--green);padding:12px;background:var(--paper)}@media(max-width:1050px){.shell{grid-template-columns:215px 275px 1fr}.grid{grid-template-columns:1fr}main{padding:24px}}@media(max-width:720px){.top{height:auto;flex-wrap:wrap}.brand{min-width:0}.search{order:3;flex-basis:100%}.shell{display:block}.left,.middle{position:static;height:auto}.left{display:flex;overflow:auto}.left .label{display:none}.act{min-width:200px}.middle{max-height:390px}main{padding:18px 13px}}</style></head><body><header class="top"><div class="brand">Corporate Laws & Practices<small>ICAB PROFESSIONAL LEVEL • CUSTOM STUDY ASSISTANT</small></div><div class="search"><input id="search" placeholder="Search topic, section or keyword"></div><div class="buttons"><button onclick="font(-1)">A−</button><button onclick="font(1)">A+</button><button onclick="resetView()">Reset</button></div></header><div class="shell"><aside class="left"><div class="label">Acts & syllabus weighting</div><div id="acts"></div></aside><aside class="middle" id="middle"></aside><main id="main"></main></div><script src="data/companies-part-1.js"></script><script src="data/companies-part-2.js"></script><script src="data/companies-part-3.js"></script><script>const acts=[['Companies Act, 1994','30%','active'],['Securities & Exchange','20%','locked'],['Bank Company Act, 1991','15%','locked'],['Finance Company Act, 2023','5%','locked'],['Bangladesh Labour Act, 2006','10%','locked'],['Insurance Act, 2010','10%','locked'],['Financial Reporting Act, 2015','10%','locked'],['FRC Enlistment Rules, 2022','Within FRA','locked']];const parts=[COMPANY_PART_1,COMPANY_PART_2,COMPANY_PART_3];let state={part:1,index:0,fs:14};const source='https://bdlaws.minlaw.gov.bd/act-788.html';function renderActs(){document.getElementById('acts').innerHTML=acts.map((a,i)=>`<button class="act ${a[2]}" onclick="${i?'locked()':'selectAct()'}"><b>${a[0]}</b><span class="weight">${a[1]}</span><small>${i?'Coming sequentially':'Active • Parts 1–3'}</small></button>`).join('')}function renderMiddle(){const p=parts[state.part-1];document.getElementById('middle').innerHTML=`<h2>${p.title}</h2><p class="sub">${p.range} • ${p.status||'verified study content'}</p><div class="objective"><b>Learning objectives</b><br>Identify the legal rule, locate the section, understand the rule in plain language, apply it to a Bangladesh scenario and write an exam-ready conclusion.</div><div class="parts">${parts.map(x=>`<button class="partbtn ${x.part===state.part?'active':''}" onclick="setPart(${x.part})">Part ${x.part}</button>`).join('')}</div>${p.topics.map((x,i)=>`<button class="topic ${i===state.index?'active':''} ${p.status?'locked':''}" onclick="selectTopic(${i})">${x.n}. ${x.t}</button>`).join('')}` }function renderMain(){const p=parts[state.part-1],x=p.topics[state.index],locked=!!p.status;document.getElementById('main').innerHTML=`<section class="hero"><div class="status">Companies Act, 1994 → Part ${state.part} → Topic ${x.n}</div><h1>${x.t}</h1><p>ICAB Professional Level study view. Legal source, explanation and application are kept separate so amendments can be reviewed without silently rewriting the law.</p><div class="chips"><span class="chip">Companies Act, 1994</span><span class="chip">Part ${state.part} of 3</span><span class="chip">Source-controlled</span><span class="chip">Same-page learning</span></div></section>${locked?`<div class="card warning"><div class="eyebrow">Verification gate</div><h3>This topic is intentionally not populated yet</h3><p>The syllabus topic is visible, but the detailed section, bilingual text, explanation and example are withheld until the current official Act is checked section by section.</p><p><a href="${source}" target="_blank">Open the current Companies Act</a></p></div>`:`<div class="grid"><section class="card lawcard"><div class="eyebrow">Box 1 • Actual legal reference</div><h3>${x.ref}</h3><div class="law">English study text: ${x.en}<div class="bn">বাংলা: ${x.bn}</div></div><div class="source">Authority: <a href="${source}" target="_blank">Bangladesh Laws • Companies Act, 1994</a></div></section><section class="card easycard"><div class="eyebrow">Box 2 • Easy understanding</div><h3>What this means</h3><p>${x.easy}</p></section><section class="card full example"><div class="eyebrow">Box 3 • Bangladesh example</div><h3>Practical application</h3><p>${x.example}</p></section><section class="card full exam"><div class="eyebrow">Professional Level exam focus</div><p>${x.exam}</p></section></div>`}<div class="card update" style="margin-top:16px"><div class="eyebrow">Content update system</div><h3>Source monitoring is active</h3><p>The repository monitors the official legal and syllabus sources. A detected change creates a review flag rather than automatically rewriting legal content.</p></div>`}function selectAct(){state.part=1;state.index=0;renderMiddle();renderMain()}function locked(){alert('This Act will be unlocked sequentially after the Companies Act module is completed and verified.')}function setPart(n){state.part=n;state.index=0;renderMiddle();renderMain()}function selectTopic(i){state.index=i;renderMiddle();renderMain()}function font(d){state.fs=Math.max(12,Math.min(20,state.fs+d));document.body.style.fontSize=state.fs+'px'}function resetView(){state={part:1,index:0,fs:14};document.body.style.fontSize='14px';renderMiddle();renderMain()}document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.topic').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'block':'none')});renderActs();renderMiddle();renderMain();</script></body></html>
