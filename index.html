const D={
'1|Introduction':['Sections 2 and 4','No company, association or partnership consisting of more than ten persons may be formed for banking business unless registered under the Act or formed under another Act of Parliament.','ব্যাংক-ব্যবসা পরিচালনার উদ্দেশ্যে দশের অধিক ব্যক্তি-সমন্বয়ে কোন কোম্পানী, সমিতি বা অংশীদারী কারবার নিবন্ধিত না করে গঠন করা যায় না, যদি না অন্য কোন আইনের অধীনে গঠিত হয়।','The Companies Act is the principal statute for incorporation, operation, disclosure, audit and winding up. For exam answers, remember separate legal entity, perpetual succession, limited liability and separate property.','All shareholders of a company die. The company does not automatically disappear; its legal personality continues unless it is wound up under law.','Use the characteristics as a checklist, then apply the relevant section to the facts.'],
'1|Constitution and incorporation':['Section 5 • Mode of forming incorporated company','Any seven or more persons or, where the company to be formed will be a private company, any two or more persons associated for any lawful purpose may, by subscribing their names to a memorandum of association and otherwise with the requirements of this Act in respect of registration form an incorporated company.','পাবলিক কোম্পানী গঠনের ক্ষেত্রে সাত বা ততোধিক ব্যক্তি এবং প্রাইভেট কোম্পানী গঠনের ক্ষেত্রে দুই বা ততোধিক ব্যক্তি, আইনানুগ যে কোন উদ্দেশ্যে, সংঘস্মারকে স্বাক্ষর ও নিবন্ধন সংক্রান্ত বিধান পালন করে নিগমিত কোম্পানী গঠন করিতে পারিবে।','Formation begins with the required persons subscribing to the memorandum and completing statutory registration. The threshold is 7 for a public company and 2 for a private company.','Three founders want a private manufacturing company. They satisfy the member threshold, but still need the memorandum, articles and registration process before the company becomes a legal entity.','Exam trigger: distinguish the public/private member threshold and connect it to the incorporation sequence.'],
'1|Shares and capital':['Sections 30, 53, 58, 59, 74, 154 and 155','The Act regulates transferability of shares, alteration of capital, restrictions on purchase of own shares, reduction of capital, reserve share capital, redeemable preference shares and further issue of capital.','মূল বিষয়: শেয়ার হস্তান্তর, মূলধন পরিবর্তন, নিজস্ব শেয়ার ক্রয়ের সীমাবদ্ধতা, শেয়ার মূলধন হ্রাস, reserve share capital, redeemable preference shares এবং further issue of capital।','Treat capital questions as procedure questions: identify the power, resolution, court or creditor involvement, filing and effect.','A company wants to reduce paid-up capital. The board alone cannot complete the reduction; the statutory resolution and court confirmation process must be followed.','Build a section map instead of memorising isolated numbers.'],
'1|Procedure for formation and registration of a company':['Sections 5, 17–25','The incorporation framework links memorandum, articles, statutory declarations, particulars of directors and Registrar registration. Section 25 gives the certificate of incorporation conclusive effect on the matters stated in the section.','গঠন ও নিবন্ধনে সংঘস্মারক, সংঘবিধি, ঘোষণাপত্র, পরিচালক সংক্রান্ত তথ্য এবং রেজিস্ট্রারের নিবন্ধন কার্যক্রম গুরুত্বপূর্ণ। ধারা ২৫ নিগমিতকরণের প্রত্যয়নপত্রের চূড়ান্ততার বিধান দেয়।','Use a chronological flow: promoters → name → memorandum/articles → prescribed forms → Registrar → certificate → post-incorporation compliance.','A promoter signs a business contract before incorporation. The future company did not yet exist, so the promoter cannot assume the company is automatically bound.','Separate pre-incorporation issues from post-incorporation compliance.'],
'1|Board meeting and minute':['Secretarial practice • board meetings and minutes','Board meetings, notices, quorum, resolutions and minutes form a core secretarial practice area. Check the Act, Articles and applicable governance requirements together.','বোর্ড সভা, নোটিশ, কোরাম, সিদ্ধান্ত এবং মিনিট সংরক্ষণ secretarial practice-এর মূল অংশ। আইন, সংঘবিধি ও governance requirements একসাথে বিবেচনা করতে হবে।','The practical objective is an auditable decision trail. A good minute evidences attendance, quorum, decisions and relevant declarations or dissent.','A board approves a major related-party transaction. The minute should evidence the meeting, quorum, resolution and relevant disclosure or abstention.','Ask: was the meeting properly called, properly constituted and properly documented?'],
'2|Corporate Governance Code':['BSEC Corporate Governance Code • notification 3 June 2018, amended up to 4 April 2024','For listed companies the Code imposes governance conditions including board composition, independent directors, directors’ report and key senior officers/committees. The workbook notes a board size of 5 to 20.','তালিকাভুক্ত কোম্পানীর জন্য Code বোর্ডের গঠন, independent director, directors’ report, senior management ও board committee সম্পর্কিত শর্ত আরোপ করে।','Identify the listed-company requirement, responsible governance body, compliance condition and disclosure mechanism.','A listed company has 9 directors. Test the independent-director requirement using the applicable Code formula, including rounding where required.','Keep the current BSEC Code beside the study notes because notifications can change compliance requirements.'],
'2|Financial Reporting and Disclosure Notification, 20 June 2018':['BSEC notification • financial reporting and disclosure','Financial statements of listed companies are to follow applicable Securities and Exchange Rules, IAS/IFRS and, where applicable, the Financial Reporting Act. The notification also addresses auditor appointment and rotation.','তালিকাভুক্ত কোম্পানীর আর্থিক বিবরণী প্রযোজ্য securities rules, IAS/IFRS এবং প্রযোজ্য ক্ষেত্রে Financial Reporting Act অনুযায়ী প্রস্তুত করতে হয়।','This topic connects company law, securities regulation, financial reporting standards and audit requirements.','A listed company prepares annual financial statements. The finance team must consider BSEC requirements and applicable financial reporting standards, not only the Companies Act.','Think in layers: Companies Act + BSEC requirements + FRA/FRC standards.'],
'3|Introduction':['Section 6 • Act to override articles, memorandum etc.','Where a provision in the memorandum, articles, agreement or resolution of a banking company is repugnant to the Bank Company Act, the Act prevails to the extent of the inconsistency.','ব্যাংক কোম্পানীর সংঘস্মারক, সংঘবিধি, চুক্তি বা সিদ্ধান্তের কোন বিধান এই আইনের সঙ্গে অসঙ্গতিপূর্ণ হলে অসঙ্গতির পরিমাণে এই আইন প্রাধান্য পাবে।','A banking company operates under a specialised statute. Its constitutional documents cannot override mandatory banking law.','A bank’s articles permit a transaction prohibited by the Bank Company Act. The statutory prohibition prevails.','Special banking legislation overrides inconsistent internal documents.'],
'3|Audit and inspection':['Bank Company Act • audit and inspection provisions','Banking companies are subject to statutory audit, inspection and supervisory requirements. Bangladesh Bank directions and applicable standards must be considered with the Act.','ব্যাংক কোম্পানীর statutory audit, inspection এবং Bangladesh Bank-এর supervisory requirements গুরুত্বপূর্ণ।','For an audit scenario identify the statutory audit requirement, regulator’s inspection power, reporting obligation and sector-specific circulars.','An audit identifies a material classification issue in a bank. Consider the Bank Company Act, Bangladesh Bank instructions and applicable reporting requirements together.','The workbook specifically notes BRPD and DOS circulars as relevant study material.'],
'4|Definitions':['Section 4 • Licensing of finance companies','No company shall carry on financing business in Bangladesh without a licence granted by Bangladesh Bank. The Bank considers financial condition, management, capital adequacy, structural soundness, earning capacity, memorandum objectives and public interest.','বাংলাদেশ ব্যাংকের লাইসেন্স ছাড়া কোন কোম্পানী বাংলাদেশে financing business পরিচালনা করতে পারবে না। লাইসেন্স দেওয়ার সময় আর্থিক অবস্থা, ব্যবস্থাপনা, capital adequacy, objectives ও public interest বিবেচিত হয়।','Incorporation is not enough to operate as a finance company. Sectoral licensing is the entry gate.','A newly incorporated company wants to accept deposits and conduct financing business. It must obtain the required Bangladesh Bank licence first.','Differentiate incorporation from sectoral licensing.'],
'5|Working hours and leave':['Bangladesh Labour Act • Chapter IX','The Labour Act contains rules on working hours, rest intervals, weekly holidays and leave. The exact entitlement should be checked against the worker category and current Rules/amendments.','শ্রম আইনে working hours, rest interval, weekly holiday ও leave-এর বিধান রয়েছে। প্রযোজ্য worker category ও বর্তমান Rules অনুযায়ী entitlement যাচাই করতে হবে।','Do not answer labour questions only from HR policy. Identify the worker category, then apply the statutory rule and Rules.','A factory schedules excessive continuous hours without statutory rest or holiday arrangements. Test the schedule against the Act and Rules before implementation.','Cite the chapter/section and then explain the compliance consequence.'],
'5|Wages and payment':['Bangladesh Labour Act • Chapter X','The Act regulates wages and payment, including statutory timing and protections around wage payment and deductions.','শ্রম আইনের Chapter X মজুরি ও মজুরি পরিশোধের সময়, পদ্ধতি এবং অনুমোদিত deduction সম্পর্কিত বিধান নির্ধারণ করে।','For payroll scenarios distinguish wages, permissible deductions and payment deadlines.','Payroll proposes an arbitrary deduction for damaged goods. First establish whether the deduction is legally authorised.','Connect payroll controls to statutory deduction rules.'],
'6|Registration of insurance business':['Insurance Act, 2010 • registration framework','Insurance business is subject to registration and regulatory supervision. The Act distinguishes life and non-life business and establishes requirements for capital, deposits and continuing compliance.','বাংলাদেশে insurance business পরিচালনার জন্য registration ও regulatory supervision প্রয়োজন। জীবন ও non-life business পৃথকভাবে বিবেচিত হয় এবং capital, deposit ও continuing compliance requirements রয়েছে।','Treat registration as the entry requirement and solvency, accounts, audit and management rules as continuing obligations.','An investor cannot simply incorporate a company and start selling insurance policies. Regulatory registration and licensing must be satisfied first.','Separate registration, solvency and operational compliance.'],
'7|Enlistment of Auditors (Sec 31)':['Financial Reporting Act, 2015 • Section 31','Auditors who audit Public Interest Entities must satisfy the statutory enlistment requirements under the Financial Reporting Act.','Public Interest Entity audit-এর জন্য auditor enlistment requirement প্রযোজ্য।','PIE audit eligibility is not simply a matter of professional qualification; statutory enlistment and continuing compliance matter.','A qualified CA who is not properly enlisted attempts to sign a PIE audit report. The eligibility issue must be resolved before the engagement proceeds.','Remember: PIE → enlisted/scheduled auditor → compliant audit practice.'],
'7|Auditors’ report and opinion (Sec 35)':['Financial Reporting Act, 2015 • Section 35','The Act contains requirements governing auditors’ reports and opinions for entities within its regulatory scope.','আইনটি প্রযোজ্য entity-এর auditors’ report ও opinion সম্পর্কিত বিধান নির্ধারণ করে।','Focus on reporting responsibility, applicable standards, independence and consequences of non-compliance.','Management asks an auditor to issue an unmodified opinion despite a material unresolved issue. The auditor must apply the applicable standards and legal requirements.','Link this with Sections 37, 40 and 47 where independence or standards are involved.'],
'8|Application for enlistment (Rule 3)':['FRC Enlistment Rules, 2022 • Rule 3','Rule 3 deals with application for enlistment of auditors and audit firms and should be read with eligibility and documentation requirements in later rules.','Rule 3 auditor ও audit firm enlistment-এর application process নিয়ে কাজ করে এবং পরবর্তী rules-এর eligibility ও documentation requirements-এর সঙ্গে পড়তে হবে।','The Rules turn the statutory enlistment requirement into a practical application workflow.','A firm preparing a new enlistment application should check eligibility, gather documents, submit the application and track scrutiny and decision.','Study Rules 3–14 as one workflow rather than isolated rules.']};
function data(){return D[S.a+'|'+S.t]||['Syllabus topic • '+S.t,'Read the exact provision from the authentic law/rule linked below. This page is a learning layer and deliberately does not pretend to replace the statute.','নিচের authentic law/rule থেকে সংশ্লিষ্ট ধারা যাচাই করুন। এই page-টি learning layer, statute-এর replacement নয়.','For '+S.t+', identify the governing law, exact provision, responsible authority, procedure, threshold/time limit and consequence. Then apply the rule to the facts.','Example: A Bangladesh entity faces a compliance decision involving “'+S.t+'”. Identify the exact provision, test the facts, state the consequence and recommend the corrective action.','For Professional Level answers: provision first, facts second, conclusion third.']}
function acts(){document.getElementById('acts').innerHTML=C.map(c=>`<button class="act ${S.a==c[0]?'active':''}" onclick="act(${c[0]})"><span class="wt">${c[2]}</span><b>${c[0]}. ${c[1]}</b><small>${c[3]}</small></button>`).join('')}
function topics(){let c=C.find(x=>x[0]==S.a);document.getElementById('topics').innerHTML=`<h2>${c[1]}</h2><p>Indicative weighting: ${c[2]}</p><div class="obj"><b>Learning objectives</b><br>Define and apply the law, recall section/rule references, explain in plain language, solve Bangladesh scenarios and identify compliance consequences.</div>`+c[4].map((t,i)=>`<button class="topic ${S.t==t?'active':''}" onclick="topic(${JSON.stringify(t)})">${i+1}. ${t}</button>`).join('')}
function main(){let c=C.find(x=>x[0]==S.a),d=data(),src=SRC[S.a];document.getElementById('main').innerHTML=`<div class="crumb">${c[1]} › ${S.t}</div><div class="hero"><h1>${S.t}</h1><p>${c[3]}. Use the authentic source for the authoritative text and current amendments.</p><div class="chips"><span class="chip">${d[0]}</span><span class="chip">ICAB Professional Level</span><span class="chip">Scenario based</span></div></div><div class="grid"><section class="card"><div class="eyebrow">Box 1 • Actual law / section reference</div><h3>${d[0]}</h3><div class="tabs"><button class="${S.tab=='en'?'on':''}" onclick="tab('en')">English</button><button class="${S.tab=='bn'?'on':''}" onclick="tab('bn')">বাংলা</button></div><div class="law ${S.tab=='bn'?'bn':''}">${S.tab=='en'?d[1]:d[2]}</div><div class="source">Authentic source: <a target="_blank" href="${src[1]}">${src[0]} ↗</a></div></section><section class="card"><div class="eyebrow">Box 2 • Easy understanding</div><h3>What it means</h3><p>${d[3]}</p><div class="flash"><div class="mini"><b>Recall</b><span>Provision → condition → action</span></div><div class="mini"><b>Audit lens</b><span>Evidence the requirement.</span></div><div class="mini"><b>Exam lens</b><span>Apply facts before concluding.</span></div></div></section><section class="card full example"><div class="eyebrow">Box 3 • Bangladesh example</div><h3>Scenario application</h3><p>${d[4]}</p><div class="tip"><b>Professional Level exam tip:</b> ${d[5]}</div></section></div>`}
function render(){acts();topics();main();document.documentElement.style.fontSize=S.fs+'%'}function act(n){S.a=n;S.t=C.find(x=>x[0]==n)[4][0];render()}function topic(t){S.t=t;main();topics()}function tab(t){S.tab=t;main()}function font(n){S.fs=Math.max(90,Math.min(115,S.fs+n));render()}function resetAll(){S={a:1,t:'Introduction',tab:'en',fs:100};document.getElementById('q').value='';render()}
document.getElementById('q').addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim();if(!q){render();return}let h=C.flatMap(c=>c[4].map(t=>({c,t}))).filter(x=>(x.c[1]+' '+x.t).toLowerCase().includes(q));document.getElementById('topics').innerHTML='<h2>Search results</h2><p>'+h.length+' matching topics</p>'+h.map(x=>`<button class="topic" onclick="act(${x.c[0]});setTimeout(()=>topic(${JSON.stringify(x.t)}),0)">${x.c[0]}. ${x.t}</button>`).join('')});render();</script></body></html>
